<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão | Cadastro de Funcionários</title>

    <!-- Importando CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="cabecalho py-4 mb-4">
        <div class="container text-center">
            <h1>Cadastro de Funcionários</h1>
            <p>Sistema de Cadastro</p>
        </div>
    </header>

    <main class="container">
        <!-- Formulário de Cadastro -->
        <div class="card">
            <div class="card-header" id="card-header">
                Dados do Funcionário
            </div>
            <div class="card-body">
                <form id="formFuncionario" action="">

                    <div class="row">
                        <!-- Nome -->
                         <div class="col-md-6 mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>

                            <!-- Mensagem de Erro -->
                            <div class="mensagem-erro" id="erroNome"></div>
                         </div>

                         <!-- CPF -->
                         <div class="col-md-6 mb-3">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpf" name="cpf" required>

                            <!-- Mensagem de Erro -->
                            <div class="mensagem-erro" id="erroCpf"></div>
                         </div>

                         <!-- Telefone -->
                         <div class="col-md-6 mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone" name="telefone" required>

                            <!-- Mensagem de Erro -->
                            <div class="mensagem-erro" id="erroTelefone"></div>
                         </div>

                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Importando JavaScript -->
                            <div class="mensagem-erro" id="erroNome"></div>
                         </div>

                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Importando JavaScript -->
                            <div class="mensagem-erro" id="erroNome"></div>
                         </div>

                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Importando JavaScript -->
    <script src="script.js"></script>

    <!-- Importando Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
