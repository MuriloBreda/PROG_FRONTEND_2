<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão | Cadastro de Funcionários</title>

    <!-- Importando CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="fundo">
    <header class="cabecalho py-4 mb-5">
        <div class="container text-center">
            <h1>Cadastro de Funcionários</h1>
            <p>Sistema de Cadastro</p>
        </div>
    </header>

    <main class="container">
        <!-- Formulário de Cadastro -->
        <div class="card" id="fundo-card">
            <div class="card-header text-center" id="card-header">
                Dados do Funcionário
            </div>
            <div class="card-body">
                <form id="formFuncionario" onsubmit="enviarFormulario(event)">

                    <div class="row">
                        <!-- Nome -->
                         <div class="col-md-6 mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome">

                            <!-- Mensagem de Erro -->
                            <div class="mensagem-erro" id="erroNome"></div>
                         </div>

                         <!-- CPF -->
                         <div class="col-md-6 mb-3">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpf" name="cpf">

                            <!-- Mensagem de Erro -->
                            <div class="mensagem-erro" id="erroCpf"></div>
                         </div>

                         <!-- Telefone -->
                         <div class="col-md-6 mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone" name="telefone">

                            <!-- Mensagem de Erro -->
                            <div class="mensagem-erro" id="erroTelefone"></div>
                         </div>

                         <!-- Cargo -->
                          <div class="col-md-6 md-3">
                            <label for="cargo" class="form-label">Cargo</label>
                            <select name="cargo" id="cargo" class="form-control">
                                <option value="">Selecione um cargo</option>
                                <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
                                <option value="Desenvolvedor TI">Desenvolvedor TI</option>
                                <option value="Gerente">Gerente</option>
                            </select>
                          </div>

                          <button class="btn btn-success mb-2" type="submit">Enviar</button>
                          <button class="btn btn-danger" type="reset">Limpar Formulário</button>

                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="rodape py-5 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 Cadastro de Funcionários. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Importando JavaScript -->
    <script src="script.js"></script>

    <!-- Importando Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Importando SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
